name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '22'
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID || '412654396693' }}
  ECR_ENVIRONMENT: ${{ vars.ECR_ENVIRONMENT || 'preprod' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'random-generator-repository' }}
  IMAGE_TAG: ${{ github.run_number }}
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID || '412654396693' }}.dkr.ecr.${{ vars.AWS_REGION || 'eu-central-1' }}.amazonaws.com
  ECR_IMAGE_PREFIX: ${{ vars.AWS_ACCOUNT_ID || '412654396693' }}.dkr.ecr.${{ vars.AWS_REGION || 'eu-central-1' }}.amazonaws.com/${{ vars.ECR_ENVIRONMENT || 'preprod' }}/${{ vars.ECR_REPOSITORY || 'random-generator-repository' }}


jobs:
  build-code:
    runs-on: ubuntu-latest 
    steps: 
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Setup Node environment
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

  run-tests:
    needs: build-code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Setup Node environment
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
   
  build-and-push-backend:
    environment: ${{ vars.ECR_ENVIRONMENT || 'preprod' }}
    needs: run-tests
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Check Dockerfile for backend
        run: docker build --check . 

      - name: Build backend image
        run: docker build --tag "$ECR_IMAGE_PREFIX/backend:$IMAGE_TAG" --tag "$ECR_IMAGE_PREFIX/backend:latest" .

      - name: Configure AWS Credentials 
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}  
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      
      - name: Authenticate with Amazon ECR
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Push backend image
        run: |
          docker push "$ECR_IMAGE_PREFIX/backend:$IMAGE_TAG"
          docker push "$ECR_IMAGE_PREFIX/backend:latest"

  build-and-push-frontend:
    environment: ${{ vars.ECR_ENVIRONMENT || 'preprod' }}
    needs: run-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check Dockerfile for frontend
        run: docker build --check -f frontend/Dockerfile .

      - name: Build frontend image
        run: docker build --tag "$ECR_IMAGE_PREFIX/frontend:$IMAGE_TAG" --tag "$ECR_IMAGE_PREFIX/frontend:latest" -f frontend/Dockerfile .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Authenticate with Amazon ECR
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Push frontend image
        run: |
          docker push "$ECR_IMAGE_PREFIX/frontend:$IMAGE_TAG"
          docker push "$ECR_IMAGE_PREFIX/frontend:latest"
