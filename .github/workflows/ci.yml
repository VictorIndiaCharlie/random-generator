name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# ══════════════════════════════════════════════════
# Extracted from what used to be hardcoded
# ══════════════════════════════════════════════════
env:
  NODE_VERSION: '22'
  BACKEND_IMAGE: random-generator-backend
  FRONTEND_IMAGE: random-generator-frontend

jobs:
  # ═════════════════════════════════════════════
  # BACKEND — Express + MySQL API (repo root)
  # ═════════════════════════════════════════════
  backend:
    name: Backend – Install, Test, Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}

      - name: Build backend Docker image
        run: docker build -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} .

  # ═════════════════════════════════════════════
  # FRONTEND — static site served by nginx
  # Build context = repo root (Dockerfile copies public/ + frontend/nginx.conf)
  # ═════════════════════════════════════════════
  frontend:
    name: Frontend – Docker build (nginx)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build frontend Docker image
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            .
