name: CI

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  build-test-images:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Lint API Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Check API Dockerfile
        run: docker build --check -t random-generator-api:check .

      - name: Check frontend Dockerfile
        run: docker build --check -t random-generator-web:check -f frontend/Dockerfile .

      - name: Build API image
        run: docker build -t random-generator-api:${{ github.sha }} .

      - name: Build frontend image
        run: docker build -t random-generator-web:${{ github.sha }} -f frontend/Dockerfile .
